<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ORBC gallery — photos and videos from training, competitions, and club life." />
  <title>Gallery — ORBC Boxing Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/gallery.css" />
  <link rel="canonical" href="https://orbc.co.ke/gallery.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ORBC — Ongata Rongai Boxing Club" />
  <meta property="og:title" content="Gallery — ORBC Boxing Club" />
  <meta property="og:description" content="ORBC gallery — photos and videos from training, competitions, and club life." />
  <meta property="og:url" content="https://orbc.co.ke/gallery.html" />
  <meta property="og:image" content="https://orbc.co.ke/assets/images/orbc-logo.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Gallery — ORBC Boxing Club" />
  <meta name="twitter:description" content="ORBC gallery — photos and videos from training, competitions, and club life." />
  <meta name="twitter:image" content="https://orbc.co.ke/assets/images/orbc-logo.png" />
</head>
<body>
  <div id="nav-placeholder"></div>
  <main>

    <header class="page-hero">
      <div class="page-hero__bg" style="background-image:url('assets/images/gallery-1.jpg')"></div>
      <div class="container page-hero__content">
        <p class="page-hero__label">Life at ORBC</p>
        <h1 class="page-hero__title">Gallery</h1>
      </div>
    </header>

    <section class="section section--dark" aria-label="Gallery">
      <div class="container">
        <div class="gallery-grid" id="gallery-grid" aria-label="Gallery">
          <!-- Rendered by gallery.js -->
        </div>
      </div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer" hidden>
      <button class="lightbox__close" id="lb-close" aria-label="Close">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <button class="lightbox__nav lightbox__nav--prev" id="lb-prev" aria-label="Previous">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="lightbox__media" id="lb-media"></div>
      <button class="lightbox__nav lightbox__nav--next" id="lb-next" aria-label="Next">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <div class="lightbox__caption" id="lb-caption"></div>
    </div>

  </main>
  <div id="footer-placeholder"></div>
  <script type="module" src="js/gallery.js"></script>
</body>
</html>
